# Run daily and when custom data is updated to generate a new csv/json

name: update-microsoft-info

on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '_info/**'
  pull_request:
    branches: [ "main" ]
  # Run twice a day (5.30am and 5.30pm)
  schedule:
    - cron:  '30 5,17 * * *'
    
  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:          
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Set current date as env variable
        run: echo "NOW=$(date +'%Y-%m-%d-T%H%M%S')" >> $GITHUB_ENV
      
      - name: 'Az CLI login'
        uses: azure/login@v2
        with:
            tenant-id: ${{ vars.AZURE_TENANT_ID }}
            client-id: ${{ vars.AZURE_CLIENT_ID }}
            allow-no-subscriptions: true

      - name: Generate docs
        uses: azure/powershell@v2
        with:
          azPSVersion: "latest"
          inlineScript: |
            # Get Token
            $token = az account get-access-token --resource-type ms-graph

            # Connect to Microsoft Graph
            $accessToken = ($token | ConvertFrom-Json).accessToken | ConvertTo-SecureString -AsPlainText -Force
            Connect-MgGraph -AccessToken $accessToken

            # Run export
            ./src/Export-MicrosoftApps.ps1
            ./src/Export-GraphPermissions.ps1
            ./src/Export-UTCMTypes.ps1        

      # Partner Center only issues delegated (App+User) tokens, so a refresh token from an Admin Agent or
      # Sales Agent user is redeemed here. Without it the script keeps the previously exported prices.
      - name: Generate license data
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ vars.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ vars.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PARTNER_CENTER_REFRESH_TOKEN: ${{ secrets.PARTNER_CENTER_REFRESH_TOKEN }}
        run: |
          $exportParams = @{}

          if ($env:PARTNER_CENTER_REFRESH_TOKEN) {
            try {
              $tokenResponse = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$($env:PARTNER_CENTER_TENANT_ID)/oauth2/v2.0/token" -Body @{
                grant_type    = "refresh_token"
                client_id     = $env:PARTNER_CENTER_CLIENT_ID
                client_secret = $env:PARTNER_CENTER_CLIENT_SECRET
                refresh_token = $env:PARTNER_CENTER_REFRESH_TOKEN
                scope         = "https://api.partner.microsoft.com/user_impersonation offline_access"
              }
              $exportParams.PartnerCenterAccessToken = ConvertTo-SecureString $tokenResponse.access_token -AsPlainText -Force
            }
            catch {
              Write-Output "::warning::Partner Center token redemption failed, prices were not refreshed. Renew PARTNER_CENTER_REFRESH_TOKEN."
            }
          }
          else {
            Write-Output "::warning::PARTNER_CENTER_REFRESH_TOKEN is not set, prices were not refreshed."
          }

          ./src/Export-LicenseSkus.ps1 @exportParams
        
      - name: Update repo
        run: |
          if [[ `git status --porcelain` ]]; then
            # Changes
            echo "Updating repo"
            git config --global user.name 'Palasito'
            git config --global user.email 'chris.palavouzis@gmail.com'
            git commit -am "Daily automation"
            git push
          else
            # No changes
            echo "No changes"
          fi
